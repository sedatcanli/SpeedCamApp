name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Restore YOLO model cache
        id: yolo-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/yolov8n.tflite
          key: yolov8n-tflite-640-fp32-v1

      - name: Export YOLOv8n to TFLite
        if: steps.yolo-cache.outputs.cache-hit != 'true'
        run: |
          pip install -q "ultralytics==8.3.40" "tensorflow==2.16.1" onnx tf-keras onnxruntime "onnx2tf>1.17.5,<=1.22.3" onnxslim tflite_support "sng4onnx>=1.0.1" "onnx_graphsurgeon>=0.3.26"
          python tools/export_yolo.py
          ls -la app/src/main/assets/

      - name: Build debug APK (flaky indirmelerde 3 kez dener)
        run: |
          for i in 1 2 3; do
            gradle assembleDebug --stacktrace 2>&1 | tee build-$i.log && break || { echo "Deneme $i basarisiz, 30 sn sonra tekrar..."; sleep 30; }
          done
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Derleyici hatalarini ozetle (basarisizsa)
        if: failure()
        run: 'grep -hE "^e: " build-*.log | sort -u | head -30 || true'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpeedCam-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
