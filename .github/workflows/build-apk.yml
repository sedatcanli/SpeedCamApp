name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Ensure COCO model asset
        run: |
          mkdir -p app/src/main/assets
          if [ ! -f app/src/main/assets/mobilenet_ssd.tflite ]; then
            curl -L -o app/src/main/assets/mobilenet_ssd.tflite "https://tfhub.dev/tensorflow/lite-model/ssd_mobilenet_v1/1/metadata/1?lite-format=tflite"
          fi
          ls -la app/src/main/assets/

      - name: Build debug APK (flaky indirmelerde 3 kez dener)
        run: |
          for i in 1 2 3; do
            gradle assembleDebug --stacktrace && break || { echo "Deneme $i basarisiz, 30 sn sonra tekrar..."; sleep 30; }
          done
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpeedCam-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
