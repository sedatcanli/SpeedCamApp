name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Download YOLO model
        run: |
          mkdir -p app/src/main/assets
          f=app/src/main/assets/yolo.tflite
          if [ ! -f "$f" ]; then
            for v in v7.0 v6.2; do
              curl -sSL -o "$f" "https://github.com/ultralytics/yolov5/releases/download/$v/yolov5n.tflite" && break
            done
          fi
          ls -la app/src/main/assets/
          test "$(stat -c%s "$f")" -gt 1000000

      - name: Build debug APK (flaky indirmelerde 3 kez dener)
        run: |
          for i in 1 2 3; do
            gradle assembleDebug --stacktrace 2>&1 | tee build-$i.log && break || { echo "Deneme $i basarisiz, 30 sn sonra tekrar..."; sleep 30; }
          done
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Derleyici hatalarini ozetle (basarisizsa)
        if: failure()
        run: 'grep -hE "^e: " build-*.log | sort -u | head -30 || true'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpeedCam-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
